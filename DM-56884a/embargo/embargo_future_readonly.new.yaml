datastore:
  cls: lsst.daf.butler.datastores.fileDatastore.FileDatastore
  records:
    table: file_datastore_records
  root: <butlerRoot>
  formatters:
    preliminary_visit_image:
      formatter: lsst.images.formatters.GenericFormatter
      parameters:
        recipe: lossy16
    visit_image:
      formatter: lsst.images.formatters.GenericFormatter
      parameters:
        recipe: lossy16
    template_detector:
      formatter: lsst.images.formatters.GenericFormatter
      parameters:
        recipe: lossy16
    difference_image:
      formatter: lsst.images.formatters.GenericFormatter
      parameters:
        recipe: lossy16
registry:
  db: postgresql://usdf-butler-embargo-db-tx-ro.sdf.slac.stanford.edu:5432/lsstdb1
  managers:
    attributes: lsst.daf.butler.registry.attributes.DefaultButlerAttributeManager
    collections: lsst.daf.butler.registry.collections.synthIntKey.SynthIntKeyCollectionManager
    datasets:
      cls: lsst.daf.butler.registry.datasets.byDimensions.ByDimensionsDatasetRecordStorageManagerUUID
      config:
        overrides:
          preliminary_visit_image:
            rename: legacy_preliminary_visit_image
          future_preliminary_visit_image:
            rename: preliminary_visit_image
          template_detector:
            rename: legacy_template_detector
          future_template_detector:
            rename: template_detector
          template_matched:
            rename: legacy_template_matched
          future_template_matched:
            rename: template_matched
          difference_image_predetection:
            rename: legacy_difference_image_predetection
          future_difference_image_predetection:
            rename: difference_image_predetection
          difference_image:
            rename: legacy_difference_image
          future_difference_image:
            rename: difference_image
          difference_kernel:
            rename: legacy_difference_kernel
          future_difference_kernel:
            rename: difference_kernel
          visit_image:
            rename: legacy_visit_image
          future_visit_image:
            rename: visit_image
    datastores: lsst.daf.butler.registry.bridge.monolithic.MonolithicDatastoreRegistryBridgeManager
    dimensions: lsst.daf.butler.registry.dimensions.static.StaticDimensionRecordStorageManager
    obscore:
      cls: lsst.daf.butler.registry.obscore._manager.ObsCoreLiveTableManager
    opaque: lsst.daf.butler.registry.opaque.ByNameOpaqueTableStorageManager
  namespace: embargo
